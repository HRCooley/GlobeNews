<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  #globe { width: 100%; height: 100%; }

  .marker {
    width: 12px; height: 12px;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    pointer-events: auto;
  }
  .marker::after {
    content: '';
    position: absolute;
    top: -4px; left: -4px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: inherit;
    opacity: 0.3;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.5); opacity: 0.1; }
  }

  .marker.international { background: #ef5350; }
  .marker.national { background: #ffa726; }
  .marker.local { background: #66bb6a; }

  .cluster-marker {
    min-width: 28px; height: 28px;
    border-radius: 14px;
    background: rgba(239, 83, 80, 0.85);
    border: 2px solid rgba(255,255,255,0.5);
    color: white;
    font-size: 11px;
    font-weight: bold;
    font-family: -apple-system, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0 6px;
    pointer-events: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
<div id="globe"></div>

<script src="https://unpkg.com/globe.gl@2.35.1/dist/globe.gl.min.js"></script>
<script>
(function() {
  let currentMarkers = [];
  let globe = null;
  let lastAltitude = 2.5;
  let globeReady = false;

  function clusterMarkers(markers, altitude) {
    if (altitude < 0.05) return markers.map(m => ({ ...m, count: 1, clustered: [m] }));

    const used = new Set();
    const clusters = [];
    const distThreshold = Math.min(altitude * 8, 20);

    for (let i = 0; i < markers.length; i++) {
      if (used.has(i)) continue;
      const cluster = { ...markers[i], count: 1, clustered: [markers[i]] };
      used.add(i);

      for (let j = i + 1; j < markers.length; j++) {
        if (used.has(j)) continue;
        const dlat = markers[i].lat - markers[j].lat;
        const dlng = markers[i].lng - markers[j].lng;
        const dist = Math.sqrt(dlat * dlat + dlng * dlng);
        if (dist < distThreshold) {
          cluster.count++;
          cluster.clustered.push(markers[j]);
          used.add(j);
        }
      }
      clusters.push(cluster);
    }
    return clusters;
  }

  function initGlobe() {
    globe = Globe()
      .globeImageUrl('https://unpkg.com/three-globe@2.35.0/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe@2.35.0/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe@2.35.0/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#3a8fd6')
      .atmosphereAltitude(0.2)
      .pointOfView({ lat: 20, lng: 0, altitude: 2.5 })
      .htmlElementsData([])
      .htmlLat(d => d.lat)
      .htmlLng(d => d.lng)
      .htmlAltitude(0)
      .htmlTransitionDuration(0)
      .htmlElement(d => {
        const el = document.createElement('div');
        if (d.count > 1) {
          el.className = 'cluster-marker';
          el.textContent = d.count;
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            const ids = d.clustered.map(s => s.id);
            try { Android.onClusterTapped(JSON.stringify(ids)); } catch(ex) {}
          });
          el.addEventListener('touchend', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const ids = d.clustered.map(s => s.id);
            try { Android.onClusterTapped(JSON.stringify(ids)); } catch(ex) {}
          });
        } else {
          el.className = 'marker ' + (d.scope || 'international').toLowerCase();
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            try { Android.onMarkerTapped(d.id); } catch(ex) {}
          });
          el.addEventListener('touchend', (e) => {
            e.stopPropagation();
            e.preventDefault();
            try { Android.onMarkerTapped(d.id); } catch(ex) {}
          });
        }
        return el;
      })
      .enablePointerInteraction(false)
      .onGlobeReady(function() {
        globeReady = true;
        try { Android.onGlobeReady(); } catch(e) {}
      })
      (document.getElementById('globe'));

    // Monitor altitude changes
    function checkAltitude() {
      if (!globe) return;
      const pov = globe.pointOfView();
      if (pov && Math.abs(pov.altitude - lastAltitude) > 0.01) {
        lastAltitude = pov.altitude;
        try { Android.onZoomChanged(String(lastAltitude)); } catch(e) {}
      }
      requestAnimationFrame(checkAltitude);
    }
    checkAltitude();

    const controls = globe.controls();
    if (controls) {
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.35;
      controls.enableDamping = true;
      controls.dampingFactor = 0.12;
      controls.rotateSpeed = 0.6;
      controls.zoomSpeed = 1.2;
      controls.minDistance = 101;
      controls.maxDistance = 500;
    }
  }

  window.updateMarkers = function(jsonString) {
    try {
      currentMarkers = JSON.parse(jsonString);
      renderMarkers();
    } catch(e) {
      console.error('Failed to parse markers:', e);
    }
  };

  function renderMarkers() {
    if (!globe) return;
    const clustered = clusterMarkers(currentMarkers, lastAltitude);
    globe.htmlElementsData(clustered);

    const controls = globe.controls();
    if (controls && currentMarkers.length > 0) {
      controls.autoRotate = false;
    }
  }

  window.flyTo = function(lat, lng, altitude) {
    if (!globe) return;
    globe.pointOfView({ lat: lat, lng: lng, altitude: altitude }, 1500);
  };

  // Re-cluster when zoom changes
  let lastClusterAltitude = 2.5;
  setInterval(function() {
    if (Math.abs(lastAltitude - lastClusterAltitude) > 0.05) {
      lastClusterAltitude = lastAltitude;
      renderMarkers();
    }
  }, 400);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGlobe);
  } else {
    initGlobe();
  }
})();
</script>
</body>
</html>
