<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  #globe { width: 100%; height: 100%; }
  .maplibregl-ctrl-attrib { display: none !important; }
  .maplibregl-ctrl-logo { display: none !important; }
</style>
</head>
<body>
<div id="globe"></div>

<script src="https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.js"></script>
<script>
(function() {
  let map = null;
  let allMarkers = [];
  let mapReady = false;

  // Zoom thresholds — MapLibre zoom levels
  // zoom < 3:  globe/hemisphere view  → INTERNATIONAL only
  // zoom 3-5:  continent/region view  → + NATIONAL
  // zoom >= 5: country/city view      → + LOCAL (everything)
  var ZOOM_SHOW_NATIONAL = 3;
  var ZOOM_SHOW_LOCAL = 5;

  // Convert MapLibre zoom to Globe.gl-style altitude for ViewModel compatibility
  function altitudeFromZoom(zoom) {
    return 3.0 / Math.pow(2, zoom);
  }

  // Convert Globe.gl-style altitude to MapLibre zoom
  function zoomFromAltitude(altitude) {
    return Math.log2(3.0 / Math.max(altitude, 0.01));
  }

  // Filter markers by scope based on current zoom and push to map source
  function applyMarkers() {
    if (!map || !mapReady || !map.getSource('stories')) return;

    var zoom = map.getZoom();
    var visible = [];
    for (var i = 0; i < allMarkers.length; i++) {
      var m = allMarkers[i];
      if (m.scope === 'INTERNATIONAL') {
        visible.push(m);
      } else if (m.scope === 'NATIONAL' && zoom >= ZOOM_SHOW_NATIONAL) {
        visible.push(m);
      } else if (m.scope === 'LOCAL' && zoom >= ZOOM_SHOW_LOCAL) {
        visible.push(m);
      }
    }

    var features = [];
    for (var j = 0; j < visible.length; j++) {
      var v = visible[j];
      features.push({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [v.lng, v.lat] },
        properties: { id: v.id, title: v.title, source: v.source, scope: v.scope }
      });
    }

    map.getSource('stories').setData({
      type: 'FeatureCollection',
      features: features
    });
  }

  function initMap() {
    map = new maplibregl.Map({
      container: 'globe',
      style: {
        version: 8,
        projection: { type: 'globe' },
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
          'satellite': {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            maxzoom: 19
          }
        },
        layers: [{
          id: 'satellite-layer',
          type: 'raster',
          source: 'satellite'
        }],
        sky: {
          'atmosphere-blend': [
            'interpolate',
            ['linear'],
            ['zoom'],
            0, 1,
            5, 1,
            7, 0
          ]
        },
        light: {
          anchor: 'map',
          position: [1.5, 90, 80]
        }
      },
      center: [0, 20],
      zoom: 1.5,
      attributionControl: false,
      maxPitch: 85
    });

    map.on('load', function() {
      // GeoJSON source with built-in clustering
      map.addSource('stories', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
        cluster: true,
        clusterMaxZoom: 12,
        clusterRadius: 45
      });

      // Glow ring behind individual markers
      map.addLayer({
        id: 'unclustered-glow',
        type: 'circle',
        source: 'stories',
        filter: ['!', ['has', 'point_count']],
        paint: {
          'circle-color': [
            'match', ['get', 'scope'],
            'INTERNATIONAL', '#ef5350',
            'NATIONAL', '#ffa726',
            'LOCAL', '#66bb6a',
            '#ef5350'
          ],
          'circle-radius': 14,
          'circle-opacity': 0.15,
          'circle-stroke-width': 0
        }
      });

      // Individual marker dots
      map.addLayer({
        id: 'unclustered-point',
        type: 'circle',
        source: 'stories',
        filter: ['!', ['has', 'point_count']],
        paint: {
          'circle-color': [
            'match', ['get', 'scope'],
            'INTERNATIONAL', '#ef5350',
            'NATIONAL', '#ffa726',
            'LOCAL', '#66bb6a',
            '#ef5350'
          ],
          'circle-radius': 7,
          'circle-stroke-width': 2,
          'circle-stroke-color': 'rgba(255, 255, 255, 0.6)'
        }
      });

      // Cluster circles
      map.addLayer({
        id: 'clusters',
        type: 'circle',
        source: 'stories',
        filter: ['has', 'point_count'],
        paint: {
          'circle-color': 'rgba(239, 83, 80, 0.85)',
          'circle-radius': [
            'step', ['get', 'point_count'],
            16,   // default
            5, 20,
            10, 24,
            25, 28
          ],
          'circle-stroke-width': 2,
          'circle-stroke-color': 'rgba(255, 255, 255, 0.5)'
        }
      });

      // Cluster count labels
      map.addLayer({
        id: 'cluster-count',
        type: 'symbol',
        source: 'stories',
        filter: ['has', 'point_count'],
        layout: {
          'text-field': '{point_count_abbreviated}',
          'text-size': 12,
          'text-font': ['Open Sans Bold']
        },
        paint: {
          'text-color': '#ffffff'
        }
      });

      // Click on cluster -> get leaves and send IDs to Android
      map.on('click', 'clusters', function(e) {
        var features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
        if (!features.length) return;
        var clusterId = features[0].properties.cluster_id;
        var source = map.getSource('stories');
        source.getClusterLeaves(clusterId, 100, 0, function(err, leaves) {
          if (err || !leaves) return;
          var ids = leaves.map(function(f) { return f.properties.id; });
          try { Android.onClusterTapped(JSON.stringify(ids)); } catch(ex) {}
        });
      });

      // Click on individual marker
      map.on('click', 'unclustered-point', function(e) {
        if (!e.features || !e.features.length) return;
        var id = e.features[0].properties.id;
        try { Android.onMarkerTapped(id); } catch(ex) {}
      });

      // Also handle taps on the glow ring
      map.on('click', 'unclustered-glow', function(e) {
        if (!e.features || !e.features.length) return;
        var id = e.features[0].properties.id;
        try { Android.onMarkerTapped(id); } catch(ex) {}
      });

      mapReady = true;

      // Apply any markers that were received before the map was ready
      if (allMarkers.length > 0) {
        applyMarkers();
      }

      // Notify Android that globe is ready
      try { Android.onGlobeReady(); } catch(e) {}
    });

    // Re-filter markers when zoom changes so the right scopes are visible
    var lastFilterZoom = 1.5;
    map.on('zoomend', function() {
      var zoom = map.getZoom();
      // Only re-filter if we crossed a scope threshold
      var crossedNational = (lastFilterZoom < ZOOM_SHOW_NATIONAL) !== (zoom < ZOOM_SHOW_NATIONAL);
      var crossedLocal = (lastFilterZoom < ZOOM_SHOW_LOCAL) !== (zoom < ZOOM_SHOW_LOCAL);
      if (crossedNational || crossedLocal) {
        applyMarkers();
      }
      lastFilterZoom = zoom;
    });

    // Report altitude to Android for ViewModel
    var lastReportedAlt = altitudeFromZoom(1.5);
    map.on('moveend', function() {
      var alt = altitudeFromZoom(map.getZoom());
      if (Math.abs(alt - lastReportedAlt) > 0.05) {
        lastReportedAlt = alt;
        try { Android.onZoomChanged(String(alt)); } catch(e) {}
      }
    });
  }

  window.updateMarkers = function(jsonString) {
    try {
      allMarkers = JSON.parse(jsonString);
      applyMarkers();
    } catch(e) {
      console.error('Failed to update markers:', e);
    }
  };

  window.flyTo = function(lat, lng, altitude) {
    if (!map) return;
    var zoom = zoomFromAltitude(altitude);
    map.flyTo({ center: [lng, lat], zoom: zoom, duration: 1500 });
  };

  initMap();
})();
</script>
</body>
</html>
