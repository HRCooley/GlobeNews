<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  #globeContainer { width: 100%; height: 100%; }

  /* Story card - slides up from bottom */
  #storyCard {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(15, 15, 30, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(100, 181, 246, 0.2);
    border-radius: 20px 20px 0 0;
    padding: 20px 20px 28px;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    cursor: pointer;
  }
  #storyCard.visible { transform: translateY(0); }
  #storyCard .handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    margin: 0 auto 14px;
  }
  #storyCard .scope-badge {
    display: inline-block;
    font-size: 9px; font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  #storyCard .scope-badge.int { background: rgba(255,82,82,0.2); color: #ff5252; }
  #storyCard .scope-badge.nat { background: rgba(255,171,64,0.2); color: #ffab40; }
  #storyCard .scope-badge.loc { background: rgba(105,240,174,0.2); color: #69f0ae; }
  #storyCard .title {
    font-size: 17px; font-weight: 600;
    line-height: 1.35;
    margin-bottom: 6px;
  }
  #storyCard .source {
    font-size: 12px; color: #999;
    margin-bottom: 12px;
  }
  #storyCard .read-btn {
    display: inline-block;
    font-size: 12px; font-weight: 600;
    color: #64b5f6;
    letter-spacing: 0.5px;
  }
  #storyCard .close-btn {
    position: absolute;
    top: 16px; right: 16px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none;
    color: #888;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 88px; left: 14px;
    display: flex; flex-direction: column; gap: 5px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 10px;
    color: rgba(255,255,255,0.6);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 1s ease 0.5s;
  }
  #legend.show { opacity: 1; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    flex-shrink: 0;
  }

  /* Story count badge */
  #storyCount {
    position: fixed;
    top: 96px; right: 14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 1s ease 0.8s;
  }
  #storyCount.show { opacity: 1; }
</style>
</head>
<body>
<div id="globeContainer"></div>

<div id="storyCard">
  <div class="handle"></div>
  <button class="close-btn" id="cardClose">&times;</button>
  <div class="scope-badge" id="cardScope"></div>
  <div class="title" id="cardTitle"></div>
  <div class="source" id="cardSource"></div>
  <div class="read-btn">Read article &rarr;</div>
</div>

<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#ff5252"></div>Global</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffab40"></div>National</div>
  <div class="legend-item"><div class="legend-dot" style="background:#69f0ae"></div>Local</div>
</div>

<div id="storyCount"></div>

<script src="https://unpkg.com/globe.gl@2.33.0"></script>
<script>
(function() {
  var globe = null;
  var allMarkers = [];
  var selectedStory = null;
  var cardEl = document.getElementById('storyCard');
  var idleTimer = null;

  function scopeColor(scope) {
    if (scope === 'INTERNATIONAL') return '#ff5252';
    if (scope === 'NATIONAL') return '#ffab40';
    return '#69f0ae';
  }

  function scopeClass(scope) {
    if (scope === 'INTERNATIONAL') return 'int';
    if (scope === 'NATIONAL') return 'nat';
    return 'loc';
  }

  function scopeLabel(scope) {
    if (scope === 'INTERNATIONAL') return 'Global';
    if (scope === 'NATIONAL') return 'National';
    return 'Local';
  }

  function showStoryCard(story) {
    selectedStory = story;
    var badge = document.getElementById('cardScope');
    badge.textContent = scopeLabel(story.scope);
    badge.className = 'scope-badge ' + scopeClass(story.scope);
    document.getElementById('cardTitle').textContent = story.title;
    document.getElementById('cardSource').textContent = story.source;
    cardEl.classList.add('visible');
  }

  function hideStoryCard() {
    cardEl.classList.remove('visible');
    selectedStory = null;
  }

  // Card interaction
  cardEl.addEventListener('click', function(e) {
    if (e.target.id === 'cardClose') {
      hideStoryCard();
      return;
    }
    if (selectedStory) {
      try { Android.onMarkerTapped(selectedStory.id); } catch(ex) {}
      hideStoryCard();
    }
  });

  function initGlobe() {
    var container = document.getElementById('globeContainer');

    globe = Globe()
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#4da6ff')
      .atmosphereAltitude(0.18)
      .width(container.clientWidth)
      .height(container.clientHeight)
      .pointsData([])
      .pointLat('lat')
      .pointLng('lng')
      .pointColor(function(d) { return scopeColor(d.scope); })
      .pointAltitude(0.006)
      .pointRadius(0.35)
      .pointResolution(12)
      .onPointClick(function(point) {
        showStoryCard(point);
      })
      (container);

    // Camera controls
    var controls = globe.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.enableDamping = true;
    controls.dampingFactor = 0.15;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 0.8;
    controls.minDistance = 110;
    controls.maxDistance = 500;

    // Initial view
    globe.pointOfView({ lat: 20, lng: 0, altitude: 2.5 });

    // Report altitude changes to Android
    var lastAlt = 2.5;
    controls.addEventListener('change', function() {
      var pov = globe.pointOfView();
      if (pov && Math.abs(pov.altitude - lastAlt) > 0.1) {
        lastAlt = pov.altitude;
        try { Android.onZoomChanged(String(pov.altitude)); } catch(e) {}
      }
    });

    // Auto-rotate: stop on touch, restart after idle
    controls.addEventListener('start', function() {
      controls.autoRotate = false;
      if (idleTimer) clearTimeout(idleTimer);
    });
    controls.addEventListener('end', function() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(function() {
        controls.autoRotate = true;
      }, 10000);
    });

    // Handle resize
    window.addEventListener('resize', function() {
      globe.width(window.innerWidth).height(window.innerHeight);
    });

    // Show legend
    document.getElementById('legend').classList.add('show');

    // Notify Android
    try { Android.onGlobeReady(); } catch(e) {}
  }

  // ── Bridge functions called from Android ──

  window.updateMarkers = function(jsonString) {
    try {
      allMarkers = JSON.parse(jsonString);
      if (globe) {
        globe.pointsData(allMarkers);
        // Update count
        var countEl = document.getElementById('storyCount');
        countEl.textContent = allMarkers.length + ' stories worldwide';
        countEl.classList.add('show');
      }
    } catch(e) {
      console.error('updateMarkers error:', e);
    }
  };

  window.flyTo = function(lat, lng, altitude) {
    if (!globe) return;
    hideStoryCard();
    globe.pointOfView({ lat: lat, lng: lng, altitude: altitude }, 1500);
  };

  // ── Init ──
  initGlobe();
})();
</script>
</body>
</html>
