<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  #globe { width: 100%; height: 100%; }
  .marker-label {
    color: white;
    font-size: 10px;
    font-family: Arial, sans-serif;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<div id="globe"></div>

<script src="https://unpkg.com/globe.gl@2.35.1/dist/globe.gl.min.js"></script>
<script>
(function() {
  let currentMarkers = [];
  let globe = null;
  let lastAltitude = 2.5;
  let altitudeReportTimer = null;

  function scopeColor(scope) {
    switch(scope) {
      case 'INTERNATIONAL': return '#ef5350';
      case 'NATIONAL': return '#ffa726';
      case 'LOCAL': return '#66bb6a';
      default: return '#64b5f6';
    }
  }

  function clusterMarkers(markers, threshold) {
    if (threshold < 0.02) return markers.map(m => ({ ...m, count: 1, clustered: [m] }));

    const used = new Set();
    const clusters = [];
    const distThreshold = threshold * 15; // degrees based on altitude

    for (let i = 0; i < markers.length; i++) {
      if (used.has(i)) continue;
      const cluster = { ...markers[i], count: 1, clustered: [markers[i]] };
      used.add(i);

      for (let j = i + 1; j < markers.length; j++) {
        if (used.has(j)) continue;
        const dlat = markers[i].lat - markers[j].lat;
        const dlng = markers[i].lng - markers[j].lng;
        const dist = Math.sqrt(dlat * dlat + dlng * dlng);
        if (dist < distThreshold) {
          cluster.count++;
          cluster.clustered.push(markers[j]);
          used.add(j);
        }
      }
      clusters.push(cluster);
    }
    return clusters;
  }

  function initGlobe() {
    globe = Globe()
      .globeImageUrl('https://unpkg.com/three-globe@2.35.0/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe@2.35.0/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe@2.35.0/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#1e88e5')
      .atmosphereAltitude(0.15)
      .pointOfView({ lat: 20, lng: 0, altitude: 2.5 })
      .pointLat('lat')
      .pointLng('lng')
      .pointAltitude(d => d.count > 1 ? 0.06 : 0.02)
      .pointRadius(d => d.count > 1 ? Math.min(0.8, 0.3 + d.count * 0.05) : 0.15)
      .pointColor(d => scopeColor(d.scope))
      .pointLabel(d => {
        if (d.count > 1) {
          return '<div class="marker-label">' + d.count + ' stories<br><b>' + escapeHtml(d.title) + '</b></div>';
        }
        return '<div class="marker-label"><b>' + escapeHtml(d.title) + '</b><br>' + escapeHtml(d.source) + '</div>';
      })
      .onPointClick(d => {
        if (d.count > 1) {
          // Zoom into cluster
          globe.pointOfView({ lat: d.lat, lng: d.lng, altitude: lastAltitude * 0.4 }, 1000);
        } else {
          try { Android.onMarkerTapped(d.id); } catch(e) {}
        }
      })
      .enablePointerInteraction(true)
      (document.getElementById('globe'));

    // Monitor altitude changes
    function checkAltitude() {
      const pov = globe.pointOfView();
      if (pov && Math.abs(pov.altitude - lastAltitude) > 0.01) {
        lastAltitude = pov.altitude;
        try { Android.onZoomChanged(String(lastAltitude)); } catch(e) {}
      }
      requestAnimationFrame(checkAltitude);
    }
    checkAltitude();

    // Set initial control sensitivity
    const controls = globe.controls();
    if (controls) {
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.3;
      controls.enableDamping = true;
      controls.dampingFactor = 0.1;
      controls.rotateSpeed = 0.5;
      controls.zoomSpeed = 1.0;
      controls.minDistance = 101;
      controls.maxDistance = 500;
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  window.updateMarkers = function(jsonString) {
    try {
      const markers = JSON.parse(jsonString);
      currentMarkers = markers;
      renderMarkers();
    } catch(e) {
      console.error('Failed to parse markers:', e);
    }
  };

  function renderMarkers() {
    if (!globe) return;
    const clustered = clusterMarkers(currentMarkers, lastAltitude);
    globe.pointsData(clustered);

    // Stop auto-rotate when markers are loaded
    const controls = globe.controls();
    if (controls && currentMarkers.length > 0) {
      controls.autoRotate = false;
    }
  }

  window.flyTo = function(lat, lng, altitude) {
    if (!globe) return;
    globe.pointOfView({ lat: lat, lng: lng, altitude: altitude }, 1500);
  };

  // Re-render markers when zoom changes significantly
  let lastClusterAltitude = 2.5;
  setInterval(function() {
    if (Math.abs(lastAltitude - lastClusterAltitude) > 0.1) {
      lastClusterAltitude = lastAltitude;
      renderMarkers();
    }
  }, 300);

  // Init
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGlobe);
  } else {
    initGlobe();
  }
})();
</script>
</body>
</html>
