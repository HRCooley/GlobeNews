<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; touch-action: none; }
  #globeContainer { width: 100%; height: 100%; }

  /* Story card - slides up from bottom */
  #storyCard {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(15, 15, 30, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(100, 181, 246, 0.25);
    border-radius: 20px 20px 0 0;
    padding: 12px 20px 28px;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    cursor: pointer;
    will-change: transform;
    max-height: 55vh;
    overflow-y: auto;
  }
  #storyCard.visible { transform: translateY(0); }
  #storyCard .handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    margin: 0 auto 14px;
  }
  #storyCard .scope-badge {
    display: inline-block;
    font-size: 9px; font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  #storyCard .scope-badge.int { background: rgba(255,82,82,0.2); color: #ff5252; }
  #storyCard .scope-badge.nat { background: rgba(255,171,64,0.2); color: #ffab40; }
  #storyCard .scope-badge.loc { background: rgba(105,240,174,0.2); color: #69f0ae; }
  #storyCard .location {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #storyCard .location::before {
    content: '\1F4CD';
    font-size: 10px;
  }
  #storyCard .title {
    font-size: 17px; font-weight: 600;
    line-height: 1.35;
    margin-bottom: 6px;
  }
  #storyCard .source {
    font-size: 12px; color: #999;
    margin-bottom: 8px;
  }
  #storyCard .summary {
    font-size: 13px;
    line-height: 1.5;
    color: rgba(255,255,255,0.6);
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #storyCard .read-btn {
    display: inline-block;
    font-size: 13px; font-weight: 600;
    color: #64b5f6;
    letter-spacing: 0.5px;
    padding: 8px 16px;
    background: rgba(100, 181, 246, 0.1);
    border-radius: 8px;
    transition: background 0.2s;
  }
  #storyCard .close-btn {
    position: absolute;
    top: 12px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none;
    color: #888;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #storyCard .close-btn:active { background: rgba(255,255,255,0.15); }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 20px; left: 14px;
    display: flex; flex-direction: column; gap: 5px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 10px;
    color: rgba(255,255,255,0.6);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 1s ease 0.5s;
  }
  #legend.show { opacity: 1; }
  #legend.card-open { bottom: 88px; transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    flex-shrink: 0;
  }

  /* Story count badge */
  #storyCount {
    position: fixed;
    top: 96px; right: 14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 1s ease 0.8s;
  }
  #storyCount.show { opacity: 1; }

  /* Loading overlay for globe textures */
  #globeLoader {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    z-index: 50;
    transition: opacity 0.5s;
  }
  #globeLoader.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="globeContainer"></div>

<div id="storyCard">
  <div class="handle"></div>
  <button class="close-btn" id="cardClose">&times;</button>
  <div class="scope-badge" id="cardScope"></div>
  <div class="location" id="cardLocation"></div>
  <div class="title" id="cardTitle"></div>
  <div class="source" id="cardSource"></div>
  <div class="summary" id="cardSummary"></div>
  <div class="read-btn">Read article &rarr;</div>
</div>

<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#ff5252"></div>Global</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffab40"></div>National</div>
  <div class="legend-item"><div class="legend-dot" style="background:#69f0ae"></div>Local</div>
</div>

<div id="storyCount"></div>
<div id="globeLoader">Loading globe textures...</div>

<script src="https://unpkg.com/globe.gl@2.33.0"></script>
<script>
(function() {
  var globe = null;
  var allMarkers = [];
  var selectedStory = null;
  var highlightedId = null;
  var cardEl = document.getElementById('storyCard');
  var legendEl = document.getElementById('legend');
  var loaderEl = document.getElementById('globeLoader');
  var idleTimer = null;
  var pulsePhase = 0;
  var animFrame = null;

  function scopeColor(scope) {
    if (scope === 'INTERNATIONAL') return '#ff5252';
    if (scope === 'NATIONAL') return '#ffab40';
    return '#69f0ae';
  }

  function scopeClass(scope) {
    if (scope === 'INTERNATIONAL') return 'int';
    if (scope === 'NATIONAL') return 'nat';
    return 'loc';
  }

  function scopeLabel(scope) {
    if (scope === 'INTERNATIONAL') return 'Global';
    if (scope === 'NATIONAL') return 'National';
    return 'Local';
  }

  // ── Story Card ──

  function showStoryCard(story) {
    selectedStory = story;
    highlightedId = story.id;

    var badge = document.getElementById('cardScope');
    badge.textContent = scopeLabel(story.scope);
    badge.className = 'scope-badge ' + scopeClass(story.scope);

    var locEl = document.getElementById('cardLocation');
    if (story.location) {
      locEl.textContent = story.location;
      locEl.style.display = 'flex';
    } else {
      locEl.style.display = 'none';
    }

    document.getElementById('cardTitle').textContent = story.title;
    document.getElementById('cardSource').textContent = story.source;

    var summaryEl = document.getElementById('cardSummary');
    if (story.summary && story.summary.length > 0) {
      summaryEl.textContent = story.summary;
      summaryEl.style.display = '-webkit-box';
    } else {
      summaryEl.style.display = 'none';
    }

    cardEl.classList.add('visible');
    legendEl.classList.add('card-open');

    // Refresh marker visuals for highlight ring
    if (globe) globe.pointsData(allMarkers);

    // Fly to the story location
    globe.pointOfView({ lat: story.lat, lng: story.lng, altitude: 1.8 }, 1200);
  }

  function hideStoryCard() {
    cardEl.classList.remove('visible');
    legendEl.classList.remove('card-open');
    selectedStory = null;
    highlightedId = null;
    if (globe) globe.pointsData(allMarkers);
  }

  // ── Swipe-to-dismiss ──

  var swipeStartY = 0;
  var swipeDelta = 0;
  var isSwiping = false;

  cardEl.addEventListener('touchstart', function(e) {
    if (e.target.id === 'cardClose') return;
    swipeStartY = e.touches[0].clientY;
    swipeDelta = 0;
    isSwiping = true;
    cardEl.style.transition = 'none';
  }, { passive: true });

  cardEl.addEventListener('touchmove', function(e) {
    if (!isSwiping) return;
    swipeDelta = e.touches[0].clientY - swipeStartY;
    if (swipeDelta > 0) {
      cardEl.style.transform = 'translateY(' + swipeDelta + 'px)';
    }
  }, { passive: true });

  cardEl.addEventListener('touchend', function() {
    if (!isSwiping) return;
    isSwiping = false;
    cardEl.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)';
    if (swipeDelta > 80) {
      hideStoryCard();
    } else {
      cardEl.style.transform = cardEl.classList.contains('visible') ? 'translateY(0)' : 'translateY(100%)';
    }
  }, { passive: true });

  // Card click interaction
  cardEl.addEventListener('click', function(e) {
    if (e.target.id === 'cardClose') {
      hideStoryCard();
      return;
    }
    if (selectedStory) {
      try { Android.onMarkerTapped(selectedStory.id); } catch(ex) {}
      hideStoryCard();
    }
  });

  // ── Pulse Animation ──

  function startPulse() {
    function animate() {
      pulsePhase += 0.025;
      if (pulsePhase > Math.PI * 2) pulsePhase -= Math.PI * 2;
      animFrame = requestAnimationFrame(animate);
    }
    animate();
  }

  function getPulseAltitude(d) {
    if (d.id === highlightedId) return 0.025;
    var offset = (d._idx || 0) * 0.3;
    return 0.004 + 0.003 * Math.sin(pulsePhase + offset);
  }

  function getPulseRadius(d) {
    if (d.id === highlightedId) return 0.6;
    return 0.35;
  }

  // ── Globe Init ──

  function initGlobe() {
    var container = document.getElementById('globeContainer');

    globe = Globe()
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#4da6ff')
      .atmosphereAltitude(0.18)
      .width(container.clientWidth)
      .height(container.clientHeight)
      .pointsData([])
      .pointLat('lat')
      .pointLng('lng')
      .pointColor(function(d) {
        if (d.id === highlightedId) return '#ffffff';
        return scopeColor(d.scope);
      })
      .pointAltitude(getPulseAltitude)
      .pointRadius(getPulseRadius)
      .pointResolution(12)
      .onPointClick(function(point) {
        showStoryCard(point);
      })
      (container);

    // Camera controls
    var controls = globe.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.enableDamping = true;
    controls.dampingFactor = 0.15;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 0.8;
    controls.minDistance = 110;
    controls.maxDistance = 500;

    // Initial view
    globe.pointOfView({ lat: 20, lng: 0, altitude: 2.5 });

    // Report altitude changes to Android
    var lastAlt = 2.5;
    controls.addEventListener('change', function() {
      var pov = globe.pointOfView();
      if (pov && Math.abs(pov.altitude - lastAlt) > 0.1) {
        lastAlt = pov.altitude;
        try { Android.onZoomChanged(String(pov.altitude)); } catch(e) {}
      }
    });

    // Auto-rotate: stop on touch, restart after idle
    controls.addEventListener('start', function() {
      controls.autoRotate = false;
      if (idleTimer) clearTimeout(idleTimer);
      // Dismiss story card on globe interaction (unless touching the card)
      if (selectedStory) {
        hideStoryCard();
      }
    });
    controls.addEventListener('end', function() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(function() {
        controls.autoRotate = true;
      }, 10000);
    });

    // Handle resize
    window.addEventListener('resize', function() {
      globe.width(window.innerWidth).height(window.innerHeight);
    });

    // Hide loader once globe image loads
    var globeObj = globe.scene().children.find(function(c) { return c.type === 'Group'; });
    setTimeout(function() {
      loaderEl.classList.add('hide');
    }, 3000);

    // Show legend
    legendEl.classList.add('show');

    // Start pulse animation
    startPulse();

    // Notify Android
    try { Android.onGlobeReady(); } catch(e) {}
  }

  // ── Bridge functions called from Android ──

  window.updateMarkers = function(jsonString) {
    try {
      allMarkers = JSON.parse(jsonString);
      // Assign an index for staggered pulse
      for (var i = 0; i < allMarkers.length; i++) {
        allMarkers[i]._idx = i;
      }
      if (globe) {
        globe.pointsData(allMarkers);
        // Update count
        var countEl = document.getElementById('storyCount');
        countEl.textContent = allMarkers.length + ' stories worldwide';
        countEl.classList.add('show');
      }
    } catch(e) {
      console.error('updateMarkers error:', e);
    }
  };

  window.flyTo = function(lat, lng, altitude) {
    if (!globe) return;
    hideStoryCard();
    globe.pointOfView({ lat: lat, lng: lng, altitude: altitude }, 1500);
  };

  // ── Init ──
  initGlobe();
})();
</script>
</body>
</html>
