<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  #globe { width: 100%; height: 100%; }
  .maplibregl-ctrl-attrib { display: none !important; }
  .maplibregl-ctrl-logo { display: none !important; }
</style>
</head>
<body>
<div id="globe"></div>

<script src="https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.js"></script>
<script>
(function() {
  let map = null;
  let currentMarkers = [];

  // Convert MapLibre zoom to Globe.gl-style altitude for ViewModel compatibility
  function altitudeFromZoom(zoom) {
    return 3.0 / Math.pow(2, zoom);
  }

  // Convert Globe.gl-style altitude to MapLibre zoom
  function zoomFromAltitude(altitude) {
    return Math.log2(3.0 / Math.max(altitude, 0.01));
  }

  function initMap() {
    map = new maplibregl.Map({
      container: 'globe',
      style: {
        version: 8,
        projection: { type: 'globe' },
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
          'satellite': {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            maxzoom: 19
          }
        },
        layers: [{
          id: 'satellite-layer',
          type: 'raster',
          source: 'satellite'
        }],
        sky: {
          'atmosphere-blend': [
            'interpolate',
            ['linear'],
            ['zoom'],
            0, 1,
            5, 1,
            7, 0
          ]
        },
        light: {
          anchor: 'map',
          position: [1.5, 90, 80]
        }
      },
      center: [0, 20],
      zoom: 1.5,
      attributionControl: false,
      maxPitch: 85
    });

    map.on('load', function() {
      // GeoJSON source with built-in clustering
      map.addSource('stories', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
        cluster: true,
        clusterMaxZoom: 12,
        clusterRadius: 45
      });

      // Glow ring behind individual markers
      map.addLayer({
        id: 'unclustered-glow',
        type: 'circle',
        source: 'stories',
        filter: ['!', ['has', 'point_count']],
        paint: {
          'circle-color': [
            'match', ['get', 'scope'],
            'INTERNATIONAL', '#ef5350',
            'NATIONAL', '#ffa726',
            'LOCAL', '#66bb6a',
            '#ef5350'
          ],
          'circle-radius': 14,
          'circle-opacity': 0.15,
          'circle-stroke-width': 0
        }
      });

      // Individual marker dots
      map.addLayer({
        id: 'unclustered-point',
        type: 'circle',
        source: 'stories',
        filter: ['!', ['has', 'point_count']],
        paint: {
          'circle-color': [
            'match', ['get', 'scope'],
            'INTERNATIONAL', '#ef5350',
            'NATIONAL', '#ffa726',
            'LOCAL', '#66bb6a',
            '#ef5350'
          ],
          'circle-radius': 7,
          'circle-stroke-width': 2,
          'circle-stroke-color': 'rgba(255, 255, 255, 0.6)'
        }
      });

      // Cluster circles
      map.addLayer({
        id: 'clusters',
        type: 'circle',
        source: 'stories',
        filter: ['has', 'point_count'],
        paint: {
          'circle-color': 'rgba(239, 83, 80, 0.85)',
          'circle-radius': [
            'step', ['get', 'point_count'],
            16,   // default
            5, 20,
            10, 24,
            25, 28
          ],
          'circle-stroke-width': 2,
          'circle-stroke-color': 'rgba(255, 255, 255, 0.5)'
        }
      });

      // Cluster count labels
      map.addLayer({
        id: 'cluster-count',
        type: 'symbol',
        source: 'stories',
        filter: ['has', 'point_count'],
        layout: {
          'text-field': '{point_count_abbreviated}',
          'text-size': 12,
          'text-font': ['Open Sans Bold']
        },
        paint: {
          'text-color': '#ffffff'
        }
      });

      // Click on cluster -> get leaves and send IDs to Android
      map.on('click', 'clusters', function(e) {
        const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
        if (!features.length) return;
        const clusterId = features[0].properties.cluster_id;
        const source = map.getSource('stories');
        source.getClusterLeaves(clusterId, 100, 0, function(err, leaves) {
          if (err || !leaves) return;
          const ids = leaves.map(function(f) { return f.properties.id; });
          try { Android.onClusterTapped(JSON.stringify(ids)); } catch(ex) {}
        });
      });

      // Click on individual marker
      map.on('click', 'unclustered-point', function(e) {
        if (!e.features || !e.features.length) return;
        const id = e.features[0].properties.id;
        try { Android.onMarkerTapped(id); } catch(ex) {}
      });

      // Also handle taps on the glow ring
      map.on('click', 'unclustered-glow', function(e) {
        if (!e.features || !e.features.length) return;
        const id = e.features[0].properties.id;
        try { Android.onMarkerTapped(id); } catch(ex) {}
      });

      // Apply any markers that arrived before the map was ready
      if (currentMarkers.length > 0) {
        var features = [];
        for (var i = 0; i < currentMarkers.length; i++) {
          var m = currentMarkers[i];
          features.push({
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [m.lng, m.lat] },
            properties: { id: m.id, title: m.title, source: m.source, scope: m.scope }
          });
        }
        map.getSource('stories').setData({
          type: 'FeatureCollection',
          features: features
        });
      }

      // Notify Android that globe is ready
      try { Android.onGlobeReady(); } catch(e) {}
    });

    // Track zoom changes — use 'moveend' only (fires after zoom too)
    let lastReportedAlt = altitudeFromZoom(1.5);
    map.on('moveend', function() {
      const alt = altitudeFromZoom(map.getZoom());
      if (Math.abs(alt - lastReportedAlt) > 0.05) {
        lastReportedAlt = alt;
        try { Android.onZoomChanged(String(alt)); } catch(e) {}
      }
    });
  }

  window.updateMarkers = function(jsonString) {
    try {
      currentMarkers = JSON.parse(jsonString);
      if (!map || !map.getSource('stories')) return;

      var features = [];
      for (var i = 0; i < currentMarkers.length; i++) {
        var m = currentMarkers[i];
        features.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [m.lng, m.lat] },
          properties: { id: m.id, title: m.title, source: m.source, scope: m.scope }
        });
      }

      map.getSource('stories').setData({
        type: 'FeatureCollection',
        features: features
      });
    } catch(e) {
      console.error('Failed to update markers:', e);
    }
  };

  window.flyTo = function(lat, lng, altitude) {
    if (!map) return;
    var zoom = zoomFromAltitude(altitude);
    map.flyTo({ center: [lng, lat], zoom: zoom, duration: 1500 });
  };

  initMap();
})();
</script>
</body>
</html>
